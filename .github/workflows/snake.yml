name: Feed the café snake

on:
  schedule:
    # Daily at 00:23 UTC (05:53 IST). GitHub may delay scheduled runs.
    - cron: "23 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-snake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Refill the snack tray
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate pastel contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          # Encode hex # as %23. color_dots lists five colors, from zero to most contributions.
          outputs: |
            assets/contribution-snake.svg?color_snake=%239b7ac8&color_dots=%23f1edf7,%23d9eee3,%23b3dcc8,%238bc6ad,%235fa68b
            assets/contribution-snake-dark.svg?palette=github-dark&color_snake=%23c4a7e7&color_dots=%232c2638,%23354b47,%234c7161,%237da88d,%23b3dcc8

      - name: Save the refreshed snack tray
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-snake.svg assets/contribution-snake-dark.svg
          if git diff --staged --quiet; then
            echo "The snack tray is already fresh."
            exit 0
          fi
          git commit -m "chore: refresh contribution snakes"
          git push
